<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>野火 · 分镜提示词台</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0c0d10; --panel:#14161b; --panel2:#191c22; --line:#262a32;
  --txt:#e9e6e1; --dim:#8b8d96; --dim2:#646872;
  --hot:#e8563f; --hot2:#ff8a5c; --ok:#3ecf8e; --warn:#e8b23f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:rgba(12,13,16,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand b{font-size:21px;letter-spacing:2px;font-weight:800}
.brand span{font-size:11.5px;color:var(--hot2);letter-spacing:2px}
.stats{font-size:11.5px;color:var(--dim2);letter-spacing:.5px;flex:0 0 auto}
.top .sp{flex:1 1 auto}
#q{
  width:230px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);
  background:#0e1014;color:var(--txt);font-size:13px;outline:none;transition:.15s;
}
#q:focus{border-color:var(--hot);box-shadow:0 0 0 3px rgba(232,86,63,.14)}
.tbtn{
  padding:8px 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);font-size:12.5px;transition:.15s;
}
.tbtn:hover{border-color:var(--hot);color:var(--txt)}

.tabs{display:flex;gap:2px;background:#0f1115;border:1px solid var(--line);border-radius:8px;padding:2px}
.tab{padding:5px 12px;border:0;border-radius:6px;background:transparent;color:var(--dim);font-size:12px}
.tab.on{background:rgba(232,86,63,.16);color:#fff}
.libgrp{margin-bottom:22px}
.libgrp h3{margin:0 0 10px;font-size:14px;letter-spacing:.5px;display:flex;gap:9px;align-items:baseline}
.libgrp h3 span{font-size:11.5px;color:var(--dim2);font-weight:400}

.kind{font-size:9.5px;padding:1px 5px;border-radius:3px;letter-spacing:.3px;white-space:nowrap}
.kind.v{background:rgba(232,86,63,.16);color:#ff8a5c;border:1px solid rgba(232,86,63,.34)}
.kind.i{background:rgba(90,150,220,.13);color:#7fb3e8;border:1px solid rgba(90,150,220,.3)}
.kvid{color:#ff8a5c}.kimg{color:#7fb3e8}
.note{margin:0 0 18px;padding:11px 14px;border-radius:9px;background:rgba(232,86,63,.07);
  border:1px solid rgba(232,86,63,.2);color:#b9b6b0;font-size:12.5px;line-height:1.7}
.note b{color:#ff8a5c}

/* ---------- 布局 ---------- */
.wrap{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
nav#eps{
  position:sticky;top:57px;flex:0 0 148px;
  padding:14px 8px 40px 12px;max-height:calc(100vh - 57px);overflow-y:auto;
}
nav#eps .e{
  display:flex;gap:8px;align-items:baseline;
  padding:7px 10px;border-radius:8px;color:var(--dim);font-size:13px;
  cursor:pointer;transition:.12s;border:1px solid transparent;
}
nav#eps .e:hover{background:var(--panel);color:var(--txt)}
nav#eps .e.on{background:rgba(232,86,63,.13);border-color:rgba(232,86,63,.4);color:#fff}
nav#eps .e i{font-style:normal;font-size:11px;color:var(--dim2);letter-spacing:.5px}
nav#eps .e.on i{color:var(--hot2)}
nav#eps .e em{font-style:normal;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{flex:1 1 auto;min-width:0;padding:18px 20px 80px}

/* ---------- 集头 ---------- */
.ep-h{margin:6px 0 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ep-h h2{margin:0;font-size:20px;letter-spacing:1px}
.ep-h h2 b{color:var(--hot2);font-weight:700;margin-right:8px}
.ep-h .m{font-size:12px;color:var(--dim2)}

/* ---------- 段落 ---------- */
.seg{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin-bottom:12px;overflow:hidden;
}
.seg-h{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 16px;cursor:pointer;user-select:none;transition:.12s;
}
.seg-h:hover{background:var(--panel2)}
.seg-name{font-weight:600;font-size:14.5px;letter-spacing:.5px;white-space:nowrap}
.chip{
  font-size:11px;color:var(--dim);background:#0f1115;border:1px solid var(--line);
  padding:2px 7px;border-radius:5px;white-space:nowrap;
}
.chip.n{color:var(--hot2);border-color:rgba(232,86,63,.35);background:rgba(232,86,63,.08)}
.seg-content{font-size:12.5px;color:var(--dim2);flex:1 1 160px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{font-size:11px;color:var(--dim2);transition:transform .2s}
.seg.open .caret{transform:rotate(180deg)}
.seg-b{display:none;padding:0 12px 12px;border-top:1px solid var(--line)}
.seg.open .seg-b{display:block}
.seg-note{
  font-size:11.5px;color:var(--dim2);padding:9px 4px 10px;line-height:1.65;
  border-bottom:1px dashed var(--line);margin-bottom:10px;
}

/* ---------- 图卡 ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:1080px){.cards{grid-template-columns:1fr 1fr}}
.card{
  display:flex;gap:12px;padding:10px;border-radius:10px;
  background:var(--panel2);border:1px solid #21252c;
}
.thumb{
  flex:0 0 132px;width:132px;height:99px;border-radius:7px;overflow:hidden;
  background:#0b0c0f;border:1px solid #23262d;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .ph{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:#4e525b;font-size:10.5px;letter-spacing:.5px;
}
.thumb .fbph{
  cursor:pointer;background:repeating-linear-gradient(45deg,#0e1014,#0e1014 6px,#111318 6px,#111318 12px);
}
.thumb .fbph:hover b{color:var(--hot2)}
.thumb .fbph span{font-size:9.5px;color:#5c616b}
.thumb .ph b{font-size:15px;color:#3c4048}
.thumb .fb{
  position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font-size:9px;
  background:rgba(0,0,0,.78);color:#d8b16a;letter-spacing:0;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.cid{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cid code{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  color:var(--hot2);letter-spacing:.3px;
}
.tag{
  font-size:9.5px;color:var(--dim);border:1px solid var(--line);
  padding:1px 5px;border-radius:4px;letter-spacing:.3px;
}
.tag.p{color:var(--warn);border-color:rgba(232,178,63,.35)}
.ctitle{font-size:13px;color:var(--txt);font-weight:500;line-height:1.45}
.codes{font-size:11px;color:var(--dim2);letter-spacing:.4px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.prompt{
  font-size:12px;color:#b9b6b0;line-height:1.72;background:#0e1014;
  border:1px solid #1f2229;border-radius:6px;padding:8px 10px;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  cursor:pointer;word-break:break-word;
}
.prompt.full{display:block;-webkit-line-clamp:unset;max-height:none}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.acts button{
  font-size:11px;padding:4px 9px;border-radius:6px;
  border:1px solid #2a2e36;background:#101317;color:var(--dim);transition:.13s;
}
.acts button:hover{border-color:var(--hot);color:var(--txt)}
.acts button.done{color:var(--ok);border-color:rgba(62,207,142,.45);background:rgba(62,207,142,.08)}
.seg-foot{padding:12px 2px 2px;display:flex;gap:8px;flex-wrap:wrap}
.seg-foot button{
  font-size:12px;padding:7px 14px;border-radius:8px;
  border:1px solid var(--line);background:#101317;color:var(--dim);transition:.13s;
}
.seg-foot button:hover{border-color:var(--hot);color:var(--txt)}
.seg-foot button.done{color:var(--ok);border-color:rgba(62,207,142,.45)}

/* ---------- 大图 ---------- */
.lb{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);
  display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 20px 60px #000}
.lb .cap{
  position:absolute;bottom:16px;left:0;right:0;text-align:center;
  color:#9a9da6;font-size:12px;letter-spacing:1px;
}

/* ---------- 空态 ---------- */
.empty{color:var(--dim2);font-size:13px;padding:40px 10px;text-align:center}

/* ---------- 移动端 ---------- */
@media(max-width:820px){
  .top{padding:10px 12px;gap:9px}
  .stats{display:none}
  #q{width:100%;order:9}
  nav#eps{
    position:sticky;top:auto;flex:none;width:100%;max-height:none;
    display:flex;gap:6px;overflow-x:auto;padding:9px 12px;
    border-bottom:1px solid var(--line);background:var(--bg);top:0;z-index:30;
  }
  nav#eps .e{padding:5px 9px;border:1px solid var(--line);white-space:nowrap}
  nav#eps .e em{display:none}
  .wrap{flex-direction:column}
  main{padding:12px 12px 60px}
  .thumb{flex:0 0 96px;width:96px;height:72px}
  .seg-h{padding:11px 12px}
  .seg-content{display:none}
}

</style>

<style>
#gate{position:fixed;inset:0;z-index:99999;background:#0c0d10;display:flex;
  align-items:center;justify-content:center;padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#gate::before{content:"";position:absolute;inset:-20%;
  background:radial-gradient(38% 42% at 18% 22%,rgba(232,86,63,.20),transparent 70%),
             radial-gradient(42% 46% at 82% 78%,rgba(255,138,92,.12),transparent 72%);
  filter:blur(10px)}
#gate .bx{position:relative;width:100%;max-width:380px;background:rgba(21,23,28,.9);
  border:1px solid #262a32;border-radius:18px;padding:34px 30px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
#gate .bd{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
#gate .bd b{font-size:30px;letter-spacing:2px;font-weight:800;color:#e9e6e1}
#gate .bd span{font-size:12px;color:#ff8a5c;letter-spacing:3px}
#gate p{color:#8b8d96;font-size:12.5px;line-height:1.7;margin:0 0 24px}
#gate label{display:block;font-size:12px;color:#8b8d96;margin-bottom:8px;letter-spacing:1px}
#gate input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #262a32;
  background:#0e1014;color:#e9e6e1;font-size:16px;outline:none;letter-spacing:1px}
#gate input:focus{border-color:#e8563f;box-shadow:0 0 0 3px rgba(232,86,63,.16)}
#gate button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,#e8563f,#c93f2c);color:#fff;font-size:15px;
  font-weight:600;letter-spacing:2px}
#gate .m{min-height:20px;margin-top:12px;font-size:12.5px;color:#ff7b6b}
#gate .f{margin-top:20px;font-size:11px;color:#5c5f68;line-height:1.7}
</style>

<style>
/* ---- 编辑模式 ---- */
body.editing .card{outline:1px dashed rgba(232,86,63,.45);outline-offset:2px;align-items:flex-start}
body.editing .cards{grid-template-columns:1fr !important}
body.editing .prompt{display:none}
.ed-box{display:none}
body.editing .ed-box{display:block;margin-top:6px}
.ed-box textarea{width:100%;min-height:90px;max-height:460px;resize:vertical;
  overflow:auto;
  background:#0e1014;border:1px solid #34383f;border-radius:8px;color:#dfe3ea;
  font:13px/1.72 ui-monospace,Menlo,Consolas,"PingFang SC",monospace;
  padding:10px 11px;outline:none}
.ed-box textarea:focus{border-color:#e8563f;box-shadow:0 0 0 3px rgba(232,86,63,.14)}
.ed-box textarea.dirty{border-color:#e8563f;background:#161011}
.ed-box .ed-tip{display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:#7a7f8a;margin-top:5px;letter-spacing:.5px}
.ed-box .ed-tip b{color:#ff8a5c;font-weight:600}
.ed-box .ed-undo{background:none;border:0;color:#7a7f8a;font-size:11.5px;
  cursor:pointer;text-decoration:underline;padding:0}
#edBar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);
  z-index:9999;display:flex;align-items:center;gap:12px;
  background:rgba(21,23,28,.97);border:1px solid #33373f;border-radius:14px;
  padding:10px 12px 10px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6);
  transition:transform .22s ease;font-size:13px;color:#c9ccd4;white-space:nowrap}
#edBar.show{transform:translateX(-50%) translateY(0)}
#edBar b{color:#ff8a5c}
#edBar button{border:0;border-radius:9px;padding:9px 15px;font-size:13px;cursor:pointer;
  font-weight:600;letter-spacing:.5px}
#edSave{background:linear-gradient(135deg,#e8563f,#c93f2c);color:#fff}
#edSave[disabled]{opacity:.55;cursor:default}
#edDrop{background:#262a32;color:#c9ccd4}
#edMsg{font-size:12px;color:#8b8d96;max-width:340px;white-space:normal;line-height:1.5}
#edMsg.ok{color:#5fd08a}
#edMsg.err{color:#ff7b6b}
</style>
</head>
<body>

<div id="gate">
  <form class="bx" id="gf" autocomplete="off">
    <div class="bd"><b>野火</b><span>分镜提示词台</span></div>
    <p>整部剧的提示词与参考图。需密码进入。</p>
    <label for="gp">访问密码</label>
    <input id="gp" type="password" autocomplete="current-password" placeholder="请输入密码" autofocus>
    <button id="gb" type="submit">进入</button>
    <div class="m" id="gm"></div>
    <div class="f">《野火》· 24 集 · 内部资料，请勿外传</div>
  </form>
</div>

<div id="edBar">
  <span>未保存 <b id="edN">0</b> 处</span>
  <span id="edMsg"></span>
  <button id="edDrop">放弃</button>
  <button id="edSave">保存并发布</button>
</div>

<header class="top">
  <div class="brand"><b>野火</b><span>分镜提示词台</span></div>
  <div class="tabs"><button class="tab on" data-v="ep">按集 · 视频提示词</button><button class="tab" data-v="vid">全部视频提示词</button><button class="tab" data-v="lib">生图素材</button></div>
  <div class="stats" id="stats"></div>
  <div class="sp"></div>
  <input id="q" type="search" placeholder="搜编号 / 段落 / 内容…" autocomplete="off">
  <button class="tbtn" id="expandAll">全部展开</button>
  <button class="tbtn" id="editBtn" title="打开后可直接改提示词">✎ 编辑</button><button class="tbtn" id="logout">退出</button>
</header>

<div class="wrap">
  <nav id="eps"></nav>
  <main id="main"><div class="empty">载入中…</div></main>
</div>

<div class="lb" id="lb"><img id="lbi" alt=""><div class="cap" id="lbc"></div></div>

<script>
/* 野火 · 分镜提示词台 */
(function () {
  var D = null, curEp = "E01", openMap = {}, mode = "ep", hits = [];
  var SC = "";

  var $ = function (s) { return document.querySelector(s); };
  var main = $("#main"), nav = $("#eps");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- 载入 ---------- */
  window.__boot = function () {
  fetch("./data.json?v=" + (localStorage.getItem("yehuo_dv") || "1")).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (j) {
    if (!j) return;
    D = j; window.__D = j;
    var st = j.meta.stats;
    $("#stats").innerHTML = st.episodes + " 集 · " + st.segments + " 段 · " + st.shots + " 镜 · " +
      st.cards + " 条 · <b class=\"kvid\">视频 " + st.video + "</b> / <b class=\"kimg\">生图 " + st.image + "</b>" +
      " · 参考图 <b style=\"color:#ff8a5c\">" + st.haveImg + "</b>/" + st.cards;
    renderNav();
    renderEp(curEp);
    bindTabs();
  }).catch(function () {
    main.innerHTML = '<div class="empty">载入失败，请刷新</div>';
  });
  };

  /* ---------- 视图切换 ---------- */
  var view = "ep";

  function bindTabs() {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.onclick = function () {
        document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
        t.classList.add("on");
        view = t.dataset.v;
        $("#q").value = "";
        if (view === "lib") {
          nav.style.display = "none";
          renderList("image", "生图素材",
            "这 <b>" + D.meta.stats.image + "</b> 条是<b>生图提示词</b>（人物母版 26、配角 10、群像 3、场景空镜 26、活人层 26、道具 18）——先用它把图生成出来。图出来之后，再到「按集 · 视频提示词」里取对应镜头的视频提示词。");
        } else if (view === "vid") {
          nav.style.display = "none";
          renderList("video", "全部视频提示词",
            "这 <b>" + D.meta.stats.video + "</b> 条是<b>视频提示词</b>——挂上首帧图，直接丢进视频生成器；每条都是「只写变化、不重写外观、单镜一个动作」。按集看同一批，见左边的「按集 · 视频提示词」。");
        } else {
          nav.style.display = "";
          renderNav();
          renderEp(curEp);
        }
        window.scrollTo({ top: 0 });
      };
    });
  }

  function renderList(kind, title, note) {
    var groups = {}, order = [], total = 0, have = 0;
    D.order.forEach(function (id) {
      var c = D.cards[id];
      if (!c) return;
      if (kind && c.kind !== kind) return;
      total++;
      if (c.thumb) have++;
      if (!groups[c.cat]) { groups[c.cat] = []; order.push(c.cat); }
      groups[c.cat].push(id);
    });
    order.sort(function (a, b) {
      var ha = groups[a].filter(function (i) { return D.cards[i].thumb; }).length / groups[a].length;
      var hb = groups[b].filter(function (i) { return D.cards[i].thumb; }).length / groups[b].length;
      return hb - ha;
    });
    var h = '<div class="ep-h"><h2>' + title + '</h2><div class="m">' + total +
      ' 条 · 已出图 ' + have + ' 条 · 待出 ' + (total - have) + ' 条</div></div>';
    if (note) h += '<div class="note">' + note + '</div>';
    order.forEach(function (cat) {
      var ids = groups[cat];
      var hv = ids.filter(function (i) { return D.cards[i].thumb; }).length;
      h += '<section class="libgrp"><h3>' + esc(cat) +
        ' <span>' + ids.length + ' 条 · 已有图 ' + hv + ' / ' + ids.length + '</span></h3>' +
        '<div class="cards">' + ids.map(cardHTML).join("") + '</div></section>';
    });
    main.innerHTML = h || '<div class="empty">没有内容</div>';
    bindSegs();
  }

  /* ---------- 左侧集 ---------- */
  function renderNav() {
    nav.innerHTML = D.episodes.map(function (e) {
      return '<div class="e' + (e.ep === curEp ? " on" : "") + '" data-ep="' + e.ep + '">' +
        '<i>' + e.ep + '</i><em>' + esc(e.title) + '</em></div>';
    }).join("");
    nav.querySelectorAll(".e").forEach(function (el) {
      el.onclick = function () {
        curEp = el.dataset.ep; mode = "ep"; hits = [];
        $("#q").value = "";
        renderNav(); renderEp(curEp);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    });
  }

  /* ---------- 渲染一集 ---------- */
  function renderEp(ep) {
    var e = D.episodes.filter(function (x) { return x.ep === ep; })[0];
    if (!e) return;
    var touched = e.segs.some(function (s) { return openMap[e.ep + "|" + s.name]; });
    if (!touched && e.segs.length) openMap[e.ep + "|" + e.segs[0].name] = true;
    var h = '<div class="ep-h"><h2><b>' + e.ep + '</b>' + esc(e.title) + '</h2>' +
      '<div class="m">' + e.segs.length + ' 段 · ' + e.shots + ' 镜 · ' + e.secs + ' 秒</div></div>';
    main.innerHTML = h + e.segs.map(function (s, i) { return segHTML(e, s, i); }).join("");
    bindSegs();
  }

  function segHTML(e, s, i) {
    var key = e.ep + "|" + s.name;
    var open = openMap[key] ? " open" : "";
    var body = '<div class="seg-b">' +
      (s.note ? '<div class="seg-note">编排备注：' + esc(s.note) + '</div>' : "") +
      '<div class="cards">' + s.seq.map(function (cid) { return cardHTML(cid); }).join("") + '</div>' +
      '<div class="seg-foot"><button class="cp-seg" data-k="' + esc(key) + '">复制本段全部提示词</button></div>' +
      '</div>';
    return '<section class="seg' + open + '" data-k="' + esc(key) + '">' +
      '<div class="seg-h"><span class="caret">▾</span>' +
      '<span class="seg-name">' + esc(s.name) + '</span>' +
      '<span class="chip">' + s.secs + 's</span>' +
      '<span class="chip">' + s.shots + ' 镜</span>' +
      '<span class="chip n">' + s.seq.length + ' 张图</span>' +
      '<span class="seg-content">' + esc(s.content) + '</span>' +
      '</div>' + body + '</section>';
  }

  function kindBadge(c) {
    return c.kind === 'video'
      ? '<span class="kind v">▶ 视频提示词</span>'
      : '<span class="kind i">▣ 生图提示词</span>';
  }

  function cardHTML(cid) {
    var c = D.cards[cid];
    if (!c) return '<article class="card"><div class="meta"><div class="cid"><code>' + esc(cid) + '</code></div>' +
      '<div class="ctitle">总表里没有这条编号</div></div></article>';

    var thumb;
    if (c.thumb) {
      thumb = '<img src="' + c.thumb + '" loading="lazy" alt="' + esc(cid) + '" data-big="' + c.thumb + '" data-cap="' + esc(cid + " · " + c.title) + '">';
    } else if (c.fbThumb) {
      thumb = '<div class="ph fbph" data-fb="' + c.fbThumb + '" data-cap="' + esc(cid + " · 图未出，暂看 " + c.fb + " 空镜") + '">' +
        '<b>图未出</b><span>点看 ' + esc(c.fb) + ' 空镜</span></div>';
    } else {
      thumb = '<div class="ph"><b>图未出</b><span>暂无参考</span></div>';
    }

    var tags = '<span class="tag">' + esc(c.cat) + '</span>' +
      (c.pri ? '<span class="tag p">' + esc(c.pri) + '</span>' : "");
    var codes = [c.dur && c.dur !== "0" ? c.dur + "s" : "", c.c, c.a, c.e].filter(Boolean).join(" · ");

    return '<article class="card">' +
      '<div class="thumb">' + thumb + '</div>' +
      '<div class="meta">' +
      '<div class="cid"><code>' + esc(cid) + '</code>' + kindBadge(c) + tags + '</div>' +
      '<div class="ctitle">' + esc(c.title) + '</div>' +
      '<div class="codes">' + esc(codes) + '</div>' +
      '<div class="prompt" data-full="' + esc(c.prompt) + '">' + esc(c.prompt) + '</div>' +
      '<div class="acts">' +
      '<button class="cp" data-id="' + esc(cid) + '">复制提示词</button>' +
      '<button class="tg">展开全文</button>' +
      '</div></div></article>';
  }

  /* ---------- 交互 ---------- */
  function bindSegs() {
    document.querySelectorAll(".seg").forEach(function (sec) {
      var head = sec.querySelector(".seg-h");
      head.onclick = function (ev) {
        if (ev.target.closest("button")) return;
        sec.classList.toggle("open");
        openMap[sec.dataset.k] = sec.classList.contains("open");
      };
    });

    document.querySelectorAll(".prompt").forEach(function (p) {
      p.onclick = function () {
        p.classList.toggle("full");
        var b = p.parentNode.querySelector(".tg");
        if (b) b.textContent = p.classList.contains("full") ? "收起" : "展开全文";
      };
    });

    document.querySelectorAll(".tg").forEach(function (b) {
      b.onclick = function () {
        var p = b.closest(".meta").querySelector(".prompt");
        p.click();
      };
    });

    document.querySelectorAll(".cp").forEach(function (b) {
      b.onclick = function () {
        var c = D.cards[b.dataset.id];
        copy(c.prompt, b, "复制提示词");
      };
    });

    document.querySelectorAll(".cp-seg").forEach(function (b) {
      b.onclick = function () {
        var sec = b.closest(".seg");
        var txt = [];
        sec.querySelectorAll(".card").forEach(function (card) {
          var code = card.querySelector(".cid code");
          var title = card.querySelector(".ctitle");
          var pr = card.querySelector(".prompt");
          if (!code || !pr) return;
          var codes = card.querySelector(".codes");
          txt.push("【" + code.textContent + "】" + title.textContent +
            (codes && codes.textContent ? "  " + codes.textContent : "") +
            "\n" + pr.dataset.full + "\n");
        });
        copy(txt.join("\n"), b, "复制本段全部提示词");
      };
    });

    document.querySelectorAll(".thumb img").forEach(function (img) {
      img.onclick = function () { openLB(img.dataset.big, img.dataset.cap); };
    });

    document.querySelectorAll(".fbph").forEach(function (ph) {
      ph.onclick = function () { openLB(ph.dataset.fb, ph.dataset.cap); };
    });
  }

  /* ---------- 复制 ---------- */
  function copy(text, btn, label) {
    function done() {
      var old = btn.textContent;
      btn.textContent = "已复制";
      btn.classList.add("done");
      setTimeout(function () { btn.textContent = old || label; btn.classList.remove("done"); }, 1500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }
  function fallback(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { alert("复制失败，请手动选中"); }
    document.body.removeChild(ta);
  }

  /* ---------- 大图 ---------- */
  function openLB(src, cap) {
    $("#lbi").src = src;
    $("#lbc").textContent = cap || "";
    $("#lb").classList.add("on");
  }
  $("#lb").onclick = function () { $("#lb").classList.remove("on"); $("#lbi").src = ""; };

  /* ---------- 搜索 ---------- */
  var timer = null;
  $("#q").oninput = function () {
    clearTimeout(timer);
    var q = this.value.trim().toLowerCase();
    timer = setTimeout(function () {
      if (!q) { mode = "ep"; if (view === "lib") { view = "ep"; nav.style.display = ""; renderNav(); } renderEp(curEp); return; }
      if (view === "lib") {
        view = "ep"; nav.style.display = "";
        document.querySelectorAll(".tab").forEach(function (x) { x.classList.toggle("on", x.dataset.v === "ep"); });
      }
      mode = "search";
      hits = [];
      D.episodes.forEach(function (e) {
        e.segs.forEach(function (s) {
          var hay = (e.ep + " " + e.title + " " + s.name + " " + s.content + " " + s.seq.join(" ")).toLowerCase();
          if (hay.indexOf(q) >= 0) hits.push({ e: e, s: s });
        });
      });
      if (!hits.length) {
        main.innerHTML = '<div class="empty">没有匹配「' + esc(q) + '」的段落</div>';
        return;
      }
      main.innerHTML = '<div class="ep-h"><h2>搜索</h2><div class="m">' +
        esc(q) + ' · 命中 ' + hits.length + ' 段</div></div>' +
        hits.map(function (h, i) {
          return segHTML({ ep: h.e.ep }, h.s, i).replace(
            '<span class="seg-name">',
            '<span class="seg-name"><b style="color:#ff8a5c;margin-right:6px">' + h.e.ep + '</b>');
        }).join("");
      bindSegs();
      document.querySelectorAll(".seg").forEach(function (s) { s.classList.add("open"); });
    }, 220);
  };

  /* ---------- 全部展开 ---------- */
  $("#expandAll").onclick = function () {
    var secs = document.querySelectorAll(".seg");
    var anyClosed = Array.prototype.some.call(secs, function (s) { return !s.classList.contains("open"); });
    secs.forEach(function (s) {
      s.classList.toggle("open", anyClosed);
      openMap[s.dataset.k] = anyClosed;
    });
    this.textContent = anyClosed ? "全部收起" : "全部展开";
  };

  /* ---------- 退出 ---------- */
  $("#logout").onclick = function () {
    try{localStorage.removeItem("yehuo_ok")}catch(e){} location.reload();
  };
})();

</script>

<script>
(function(){
  var H = "a05d633af913499d3a432fe7b1f31419e1a5cd83828e0ac733f964d1034d57ed";
  function sha(s){
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b), function(x){
          return ("00"+x.toString(16)).slice(-2);
        }).join("");
      });
    }
    return Promise.resolve(s === "yehuo::" + "cfh0872753" + "::v1" ? H : "");
  }
  function open(){
    var g = document.getElementById("gate");
    if (g && g.parentNode) g.parentNode.removeChild(g);
    if (window.__boot) window.__boot();
  }
  try { if (localStorage.getItem("yehuo_ok") === H) { open(); return; } } catch(e){}
  var f = document.getElementById("gf"), p = document.getElementById("gp"),
      b = document.getElementById("gb"), m = document.getElementById("gm");
  f.addEventListener("submit", function(e){
    e.preventDefault();
    if (!p.value) { p.focus(); return; }
    b.disabled = true; b.textContent = "验证中…"; m.textContent = "";
    sha("yehuo::" + p.value + "::v1").then(function(h){
      if (h === H) {
        try { localStorage.setItem("yehuo_ok", H); } catch(e){}
        open();
      } else {
        m.textContent = "密码不正确";
        b.disabled = false; b.textContent = "进入"; p.select();
      }
    });
  });
})();
</script>

<script>
/* 站内编辑：保存 = 用 GitHub API 提交 data.json，约 1 分钟 Pages 自动更新 */
(function(){
  var OWNER = "CMIDI-AI", REPO = "yehuo", PATH = "data.json";
  var TKEY = "yehuo_gh_token";
  var editing = false, dirty = {};

  function $(s){ return document.querySelector(s); }
  function ghToken(){
    var t = localStorage.getItem(TKEY);
    if (t) return t;
    t = window.prompt("第一次保存需要 GitHub Token（只存本机浏览器，不会公开）\n\n仓库：" + OWNER + "/" + REPO);
    if (t) { t = t.trim(); localStorage.setItem(TKEY, t); }
    return t;
  }

  function b64utf8(str){
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  /* 把每张卡的 .prompt 换成 textarea */
  function autoGrow(ta){
    ta.style.height = "auto";
    ta.style.height = Math.min(460, Math.max(90, ta.scrollHeight + 2)) + "px";
  }

  function decorate(){
    if (!window.__D) return;
    document.querySelectorAll(".card").forEach(function(card){
      if (card.querySelector(".ed-box")) return;
      var code = card.querySelector(".cid code");
      if (!code) return;
      var id = code.textContent.trim();
      var c = window.__D.cards[id];
      var pr = card.querySelector(".prompt");
      if (!c || !pr) return;

      var box = document.createElement("div");
      box.className = "ed-box";
      var ta = document.createElement("textarea");
      ta.value = c.prompt || "";
      ta.dataset.id = id;
      ta.spellcheck = false;
      var tip = document.createElement("div");
      tip.className = "ed-tip";
      tip.innerHTML = "<span>改完点右下角「保存并发布」</span>" +
        "<button class='ed-undo' type='button'>还原本条</button>";

      ta.addEventListener("input", function(){
        var changed = ta.value !== (c.prompt || "");
        ta.classList.toggle("dirty", changed);
        if (changed) dirty[id] = ta.value; else delete dirty[id];
        autoGrow(ta);
        refreshBar();
      });
      tip.querySelector(".ed-undo").addEventListener("click", function(){
        ta.value = c.prompt || "";
        ta.classList.remove("dirty");
        delete dirty[id];
        autoGrow(ta);
        refreshBar();
      });

      box.appendChild(ta);
      box.appendChild(tip);
      pr.parentNode.insertBefore(box, pr.nextSibling);
      autoGrow(ta);
    });
    refreshBar();
  }

  function refreshBar(){
    var n = Object.keys(dirty).length;
    var el = $("#edN");
    if (el) el.textContent = n;
    var bar = $("#edBar");
    if (bar) bar.classList.toggle("show", editing && n > 0);
  }

  function msg(t, cls){
    var m = $("#edMsg");
    if (!m) return;
    m.textContent = t || "";
    m.className = cls || "";
  }

  function toggle(){
    editing = !editing;
    document.body.classList.toggle("editing", editing);
    var b = $("#editBtn");
    if (b) b.textContent = editing ? "✓ 编辑中" : "✎ 编辑";
    if (editing) {
      decorate();
      msg("直接改文字，改完点「保存并发布」", "");
    } else {
      // 退出编辑：把最终内容写回卡片显示
      document.querySelectorAll(".ed-box textarea").forEach(function(ta){
        var id = ta.dataset.id, c = window.__D && window.__D.cards[id];
        var box = ta.closest(".ed-box");
        var pr = box && box.parentNode.querySelector(".prompt");
        if (pr && c) {
          c.prompt = ta.value;
          pr.dataset.full = ta.value;
          pr.textContent = ta.value;
        }
      });
      msg("", "");
      $("#edBar").classList.remove("show");
    }
  }

  async function save(){
    var ids = Object.keys(dirty);
    if (!ids.length) return;
    var token = ghToken();
    if (!token) { msg("没有 Token，无法保存", "err"); return; }

    var saveBtn = $("#edSave"), dropBtn = $("#edDrop");
    saveBtn.disabled = true; saveBtn.textContent = "提交中…";
    msg("正在提交…", "");

    // 把改动写进数据对象
    ids.forEach(function(id){
      if (window.__D.cards[id]) window.__D.cards[id].prompt = dirty[id];
    });
    if (window.__D.meta) window.__D.meta.saved = new Date().toISOString();

    var api = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + PATH;
    var H = { "Authorization": "token " + token, "Accept": "application/vnd.github+json" };
    try {
      var g = await fetch(api + "?ref=main&t=" + Date.now(), { headers: H, cache: "no-store" });
      if (g.status === 401) { localStorage.removeItem(TKEY); throw new Error("Token 无效或已过期"); }
      var sha = null;
      if (g.ok) { sha = (await g.json()).sha; }
      else if (g.status !== 404) { throw new Error("读取失败 HTTP " + g.status); }

      var body = {
        message: "改提示词 " + new Date().toLocaleString("zh-CN", { hour12: false }) +
                 "（" + ids.length + " 条）",
        content: b64utf8(JSON.stringify(window.__D))
      };
      if (sha) body.sha = sha;

      var p = await fetch(api, {
        method: "PUT",
        headers: Object.assign({ "Content-Type": "application/json" }, H),
        body: JSON.stringify(body)
      });
      if (!p.ok) {
        var e = await p.text();
        throw new Error("提交失败 HTTP " + p.status + " " + e.slice(0, 120));
      }

      dirty = {};
      document.querySelectorAll(".ed-box textarea").forEach(function(t){ t.classList.remove("dirty"); });
      saveBtn.textContent = "已发布";
      msg("已提交 " + ids.length + " 条，约 1 分钟生效", "ok");
      try { localStorage.setItem("yehuo_dv", String(Date.now())); } catch(e){}
      refreshBar();
      setTimeout(function(){ saveBtn.textContent = "保存并发布"; }, 2600);
    } catch (err) {
      msg(err.message || "提交失败", "err");
      saveBtn.textContent = "保存并发布";
    } finally {
      saveBtn.disabled = false;
    }
  }

  function drop(){
    Object.keys(dirty).forEach(function(id){
      document.querySelectorAll('.ed-box textarea[data-id="' + id + '"]').forEach(function(ta){
        ta.value = (window.__D.cards[id].prompt || "");
        ta.classList.remove("dirty");
      });
    });
    dirty = {};
    refreshBar();
    msg("已放弃未保存的改动", "");
  }

  function bind(){
    var b = $("#editBtn");
    if (!b || b.dataset.bound) return;
    b.dataset.bound = "1";
    b.addEventListener("click", toggle);
    $("#edSave").addEventListener("click", save);
    $("#edDrop").addEventListener("click", drop);
  }

  /* 切换集/标签后会重渲染，编辑模式下自动重新挂 textarea */
  var mo = new MutationObserver(function(){
    if (editing) decorate();
  });
  document.addEventListener("DOMContentLoaded", function(){
    bind();
    mo.observe(document.getElementById("main") || document.body, { childList: true, subtree: false });
    var iv = setInterval(function(){ if ($("#editBtn")) { bind(); clearInterval(iv); } }, 300);
  });
  window.addEventListener("load", function(){ bind();
    var t = setInterval(function(){ if ($("#editBtn")) { bind(); clearInterval(t); } }, 400); });
})();
</script>
